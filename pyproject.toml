# Shared Python tooling config for ml/ and backend/ (not an installable package).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ml/notebooks", "frontend"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, numpy/pandas hygiene
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs real backing services (Postgres)",
  "slow: end-to-end training smoke tests",
]

[tool.coverage.run]
source = ["ml/src", "backend/app"]
omit = ["*/notebooks/*"]

[tool.coverage.report]
# Start at 70, ratchet to 80 once the pipeline is real (H03). Never lower it.
fail_under = 70
show_missing = true
skip_empty = true
