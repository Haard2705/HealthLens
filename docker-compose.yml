# HealthLens local stack: Postgres + FastAPI + Next.js, all three live (H04, H16, H21).
#
#   docker compose up --build       the whole app on http://localhost:3000
#   docker compose up db            just Postgres, for running the apps from your shell
#
# The API image bakes in the model artifacts, which are gitignored, so it must be built
# on a machine that has run the pipeline (`python -m ml.src.train`). Without them the
# prediction endpoints answer 503 and the rest of the app still works.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthlens}
      POSTGRES_DB: ${POSTGRES_DB:-healthlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthlens} -d ${POSTGRES_DB:-healthlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the schema and loads the demo users and synthetic patients, then
  # exits. The API does not create its own schema, so this has to run before it serves
  # traffic against a fresh database. Re-running it is safe (the seed upserts).
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.scripts.seed_db"]
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-healthlens}:${POSTGRES_PASSWORD:-healthlens}@db:5432/${POSTGRES_DB:-healthlens}?sslmode=disable
      # sslmode is explicit because backend/app/db/engine.py adds sslmode=require for any
      # host it does not recognise as local, which is right for Supabase but wrong here:
      # "db" is a compose service name and the postgres image serves no TLS. The engine
      # leaves an explicit value alone. Do NOT disable TLS against a hosted database.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password-123}
      # A real value, not ${JWT_SECRET:-}: an empty string still *sets* the variable, which
      # overrides the in-code development default and makes token signing fail at login
      # with "HMAC key must not be empty". This value is for the local stack over
      # synthetic data only; production sets its own via `fly secrets set`.
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-not-a-secret-0123456789abcdef}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-healthlens}:${POSTGRES_PASSWORD:-healthlens}@db:5432/${POSTGRES_DB:-healthlens}?sslmode=disable
      # sslmode is explicit because backend/app/db/engine.py adds sslmode=require for any
      # host it does not recognise as local, which is right for Supabase but wrong here:
      # "db" is a compose service name and the postgres image serves no TLS. The engine
      # leaves an explicit value alone. Do NOT disable TLS against a hosted database.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password-123}
      # A real value, not ${JWT_SECRET:-}: an empty string still *sets* the variable, which
      # overrides the in-code development default and makes token signing fail at login
      # with "HMAC key must not be empty". This value is for the local stack over
      # synthetic data only; production sets its own via `fly secrets set`.
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-not-a-secret-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # A build arg, not just an environment variable: Next resolves the rewrite
        # destination during `next build` and compiles it into routes-manifest.json.
        # Service name, not localhost, because inside the compose network the API is
        # reachable as "api". The browser never sees this; it only ever talks to the web
        # service, which proxies /api/* onward so the session cookie stays first-party.
        BACKEND_URL: http://api:8000
    environment:
      NEXT_PUBLIC_DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-password-123}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
