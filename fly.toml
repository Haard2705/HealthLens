# Fly.io deployment for the HealthLens API (ADR-0009, H27).
#
# The frontend is NOT here: it goes to Vercel, which proxies /api/* to this app so the
# session cookie stays first-party (see frontend/next.config.ts and H28's cookie note).
#
# Why Fly and not Vercel for this service: the API is a long-running process that loads
# the trained pipelines at startup and keeps them resident. Vercel's serverless functions
# are per-request and capped well below what that needs.
#
# First time:
#     fly launch --no-deploy --copy-config    (claims the app name below)
#     fly secrets set JWT_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#                     DEMO_PASSWORD="<pick one>"
#     fly deploy --local-only
#
# --local-only matters: it builds the image with your Docker Desktop and pushes the
# result. The model artifacts are gitignored, so a remote builder working from the repo
# would produce an image with no models and every prediction would answer 503 (H27 says
# artifacts reach the backend baked into the image or fetched at start, never via git).
app = "healthlens-api"
primary_region = "yyz"              # Toronto: closest Fly region to Thunder Bay

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENV = "production"
  # Same-origin through the Vercel rewrite means the browser never sends a cross-site
  # request, so this list only needs to cover direct API access during development.
  CORS_ORIGINS = "http://localhost:3000"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine warm. auto_stop would save credit but costs a cold start of several
  # seconds on the first request, which is not what you want mid-presentation.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      path = "/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB, not the 256 MB default: the container peaked at 541 MB serving a diabetes
  # prediction, because that condition selects a random forest whose explainer is 82 MB
  # on disk and allocates further when shap.TreeExplainer runs.
  memory = "1gb"
